<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0d0f">
<title>Ketone</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#0a0d0f;--surface:#11161a;--raised:#171d22;--line:#1e262c;--text:#e6edf0;--muted:#7f8d96;--accent:#2ee6c5;--on-accent:#04201b;--danger:#ff6b6b;--r:12px;--pad:clamp(12px,3vw,32px)}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* logo */
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:32px;height:32px;flex:none}
.logo span{font-size:1.2rem;font-weight:700;letter-spacing:.3px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
.login .logo{justify-content:center;margin-bottom:6px}
.login .logo svg{width:52px;height:52px}
.login .logo span{font-size:1.8rem}
.login p{color:var(--muted);text-align:center;font-size:.9rem;margin-bottom:6px}
input[type=password],input[type=search]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);color:var(--text);padding:12px 14px;font:inherit;font-size:16px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:.88rem}
.btn:hover{border-color:#34434d}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.err{color:var(--danger);font-size:.85rem;text-align:center;min-height:1.2em}

/* app shell */
.top{position:sticky;top:0;z-index:5;background:rgba(10,13,15,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px var(--pad);padding-top:calc(10px + env(safe-area-inset-top))}
.top .sp{flex:1}
.top .btn{padding:8px 12px}
.top .btn .lbl{display:none}
@media(min-width:560px){.top .btn .lbl{display:inline}}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px var(--pad) 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.85rem;display:inline-flex;gap:8px;align-items:center}
.tab:hover{color:var(--text);border-color:#34434d}
.tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.cnt{background:var(--raised);color:var(--accent);border-radius:999px;padding:0 7px;font-size:.75rem;font-weight:600}
.tab[aria-selected=true] .cnt{background:var(--on-accent);color:var(--accent)}
.search{position:relative;padding:10px var(--pad) 4px;max-width:560px}
.search svg{position:absolute;left:calc(var(--pad) + 13px);top:calc(10px + 14px);color:var(--muted)}
.search input{padding-left:40px}
main{padding:12px var(--pad) 56px}

/* grid: 3 on mobile, scales up to 9 on desktop */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px}
@media(min-width:560px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 12px}}
@media(min-width:760px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(min-width:960px){.grid{grid-template-columns:repeat(7,minmax(0,1fr))}}
@media(min-width:1200px){.grid{grid-template-columns:repeat(9,minmax(0,1fr));gap:18px 14px}}

.card{min-width:0}
.card .poster{position:relative;display:block;width:100%;aspect-ratio:2/3;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;padding:0;transition:border-color .15s}
.card .poster img{width:100%;height:100%;object-fit:cover;display:block}
.card .poster:hover{border-color:#34434d}
.card.on .poster{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.badge{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;background:rgba(10,13,15,.82);border:1px solid var(--line);display:grid;place-items:center;color:var(--text)}
.badge svg.i{width:15px;height:15px}
.card.on .badge{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.card .t{font-size:.76rem;font-weight:600;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.card .d{font-size:.68rem;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:2px 6px}
.card .d .lg{color:var(--accent);text-transform:uppercase}
@media(min-width:760px){.card .t{font-size:.82rem}.card .d{font-size:.72rem}.badge{width:28px;height:28px}}
.card.old{opacity:.55}
.skel .poster{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.msg{color:var(--muted);text-align:center;padding:36px 0;font-size:.92rem}
#sentinel{height:1px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:10px 16px;font-size:.88rem;max-width:90vw;z-index:10}
#toast.bad{border-color:var(--danger);color:var(--danger)}
@media(prefers-reduced-motion:reduce){.skel .poster{animation:none}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 48 48" fill="none">
    <path d="M24 6l15 8.7v17.6L24 41 9 32.3V14.7z" stroke="#2ee6c5" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M19 16v16M19 24.5l10-8.5M22.5 23l7.5 9" stroke="#2ee6c5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
  <symbol id="link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/></symbol>
  <symbol id="out" viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></symbol>
</svg>

<section class="login" id="login">
  <form id="lf">
    <div class="logo"><svg><use href="#mark"/></svg><span>Ketone</span></div>
    <p>Pick the movies your site shows.</p>
    <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Sign in</button>
    <div class="err" id="lerr"></div>
  </form>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="logo"><svg><use href="#mark"/></svg><span>Ketone</span></div>
    <div class="sp"></div>
    <button class="btn" id="copy" title="Copy API link"><svg class="i"><use href="#link"/></svg><span class="lbl">API link</span></button>
    <button class="btn" id="out" title="Sign out"><svg class="i"><use href="#out"/></svg><span class="lbl">Sign out</span></button>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <form class="search" id="sf">
    <svg class="i"><use href="#search"/></svg>
    <input id="q" type="search" placeholder="Search any movie by title" autocomplete="off">
  </form>
  <main>
    <div class="grid" id="grid"></div>
    <div class="msg" id="msg" hidden></div>
    <div id="sentinel"></div>
  </main>
</div>
<div id="toast" hidden></div>

<script>
const TABS=[['picked','Picked'],['hollywood','Hollywood'],['hindi','Hindi'],['tamil','Tamil'],['telugu','Telugu'],['malayalam','Malayalam'],['kannada','Kannada'],['bengali','Bengali'],['marathi','Marathi'],['punjabi','Punjabi']];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=n=>`<svg class="i"><use href="#${n}"/></svg>`;
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'TBA';
const today=new Date().toISOString().slice(0,10);

let pw=sessionStorage.getItem('kpw')||'';
let tab='picked',q='',page=1,total=1,busy=false,hasMore=false,token=0;
const picks=new Map(), seen=new Map();

function toast(m,bad){const t=$('toast');t.textContent=m;t.className=bad?'bad':'';t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}

async function api(url,body){
  const r=await fetch(url,{method:body?'POST':'GET',headers:{'x-admin-password':pw,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status===401)signOut();throw new Error(d.error||'Request failed')}
  return d;
}

/* auth */
$('lf').addEventListener('submit',async e=>{
  e.preventDefault();pw=$('pw').value;$('lerr').textContent='';
  try{await api('/api/admin',{action:'check'});sessionStorage.setItem('kpw',pw);start()}
  catch(err){$('lerr').textContent=err.message}
});
function signOut(){sessionStorage.removeItem('kpw');pw='';$('app').hidden=true;$('login').hidden=false}
$('out').onclick=signOut;
$('copy').onclick=()=>{navigator.clipboard.writeText(location.origin+'/api/picks').then(()=>toast('API link copied'),()=>toast(location.origin+'/api/picks'))};

/* tabs + search */
function drawTabs(){
  $('tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab" role="tab" data-t="${k}" aria-selected="${k===tab&&!q}">${l}${k==='picked'?`<span class="cnt">${picks.size}</span>`:''}</button>`).join('');
}
$('tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;
  tab=b.dataset.t;q='';$('q').value='';drawTabs();load(true);window.scrollTo({top:0});
});
$('sf').addEventListener('submit',e=>{e.preventDefault();q=$('q').value.trim();drawTabs();load(true)});
$('q').addEventListener('search',()=>{if(!$('q').value){q='';drawTabs();load(true)}});

/* render */
function card(m){
  const on=picks.has(m.id);
  seen.set(m.id,m);
  return `<article class="card${on?' on':''}${m.release_date&&m.release_date<today?' old':''}" data-id="${m.id}">
    <button class="poster" aria-pressed="${on}" aria-label="${on?'Remove':'Add'} ${esc(m.title)}">
      ${m.poster?`<img loading="lazy" src="${m.poster}" alt="">`:''}
      <span class="badge">${ic(on?'check':'plus')}</span>
    </button>
    <div class="t">${esc(m.title)}</div>
    <div class="d"><span>${fmt(m.release_date)}</span><span class="lg">${esc(m.language||'')}</span></div>
  </article>`;
}
function skel(n){return Array.from({length:n},()=>'<div class="card skel"><div class="poster"></div></div>').join('')}
function say(t){const m=$('msg');m.hidden=!t;m.textContent=t||''}

function showPicked(){
  const list=[...picks.values()].sort((a,b)=>(a.release_date||'9999').localeCompare(b.release_date||'9999'));
  $('grid').innerHTML=list.map(card).join('');
  hasMore=false;
  say(list.length?'':'Nothing picked yet. Open a tab, then tap a poster to add it.');
}

async function load(reset){
  if(reset){token++;busy=false;page=1;hasMore=false;$('grid').innerHTML='';say('')}
  if(busy)return;
  if(tab==='picked'&&!q){showPicked();return}
  const my=token;busy=true;
  const sk=document.createElement('div');sk.style.display='contents';sk.innerHTML=skel(9);$('grid').appendChild(sk);
  try{
    const url=q?`/api/browse?q=${encodeURIComponent(q)}&page=${page}`:`/api/browse?cat=${tab}&page=${page}`;
    const d=await api(url);
    if(my!==token){sk.remove();return}
    sk.remove();
    total=d.total_pages;
    $('grid').insertAdjacentHTML('beforeend',d.results.filter(m=>m.poster).map(card).join(''));
    hasMore=page<total;
    if(!$('grid').children.length)say('No movies found.');
  }catch(e){
    if(my!==token){sk.remove();return}
    sk.remove();hasMore=false;
    if(!$('grid').children.length)say(e.message);else toast(e.message,true);
  }finally{
    if(my===token){busy=false;recheck()}
  }
}

/* infinite scroll */
const io=new IntersectionObserver(es=>{
  if(es[0].isIntersecting&&hasMore&&!busy){page++;load(false)}
},{rootMargin:'700px 0px'});
io.observe($('sentinel'));
function recheck(){io.unobserve($('sentinel'));io.observe($('sentinel'))} // re-fires if still in view

/* pick / unpick */
function mark(id,on){
  document.querySelectorAll(`.card[data-id="${id}"]`).forEach(c=>{
    c.classList.toggle('on',on);
    const b=c.querySelector('.poster');b.setAttribute('aria-pressed',on);
    c.querySelector('.badge').innerHTML=ic(on?'check':'plus');
  });
}
$('grid').addEventListener('click',async e=>{
  const b=e.target.closest('.poster');if(!b)return;
  const id=+b.closest('.card').dataset.id;
  const was=picks.has(id);
  mark(id,!was);
  try{
    if(was){await api('/api/admin',{action:'remove',id});picks.delete(id)}
    else{const d=await api('/api/admin',{action:'add',id});picks.set(id,d.movie||seen.get(id))}
    drawTabs();
    if(tab==='picked'&&!q)showPicked();
  }catch(err){mark(id,was);toast(err.message,true)}
});

/* start */
async function start(){
  $('login').hidden=true;$('app').hidden=false;
  try{
    const d=await api('/api/picks?all=1&t='+Date.now());
    picks.clear();d.results.forEach(m=>picks.set(m.id,m));
  }catch(e){toast(e.message,true)}
  drawTabs();load(true);
}
if(pw)api('/api/admin',{action:'check'}).then(start).catch(()=>{});
</script>
</body>
</html>
