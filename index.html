<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d0f">
<title>Ketone</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#0a0d0f;--surface:#11161a;--line:#1e262c;--text:#e6edf0;--muted:#7f8d96;--accent:#2ee6c5;--pad:clamp(12px,3vw,32px)}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.top{position:sticky;top:0;z-index:5;background:rgba(10,13,15,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px var(--pad);padding-top:calc(12px + env(safe-area-inset-top))}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:32px;height:32px;flex:none}
.logo span{font-size:1.2rem;font-weight:700;letter-spacing:.3px}
.count{color:var(--muted);font-size:.85rem}
main{padding:18px var(--pad) 56px}
h1{font-size:1rem;font-weight:600;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px}
@media(min-width:560px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 12px}}
@media(min-width:760px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(min-width:960px){.grid{grid-template-columns:repeat(7,minmax(0,1fr))}}
@media(min-width:1200px){.grid{grid-template-columns:repeat(9,minmax(0,1fr));gap:18px 14px}}
.card{display:block;color:inherit;text-decoration:none;min-width:0;border-radius:10px}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.poster{aspect-ratio:2/3;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:border-color .15s}
.card:hover .poster{border-color:var(--accent)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.t{font-size:.76rem;font-weight:600;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.d{font-size:.68rem;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:2px 6px}
.d .lg{color:var(--accent);text-transform:uppercase}
@media(min-width:760px){.t{font-size:.82rem}.d{font-size:.72rem}}
.skel .poster{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.msg{color:var(--muted);text-align:center;padding:48px 0;font-size:.92rem}
@media(prefers-reduced-motion:reduce){.skel .poster{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="logo">
    <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <path d="M24 6l15 8.7v17.6L24 41 9 32.3V14.7z" stroke="#2ee6c5" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M19 16v16M19 24.5l10-8.5M22.5 23l7.5 9" stroke="#2ee6c5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Ketone</span>
  </div>
  <div class="count" id="count"></div>
</header>
<main>
  <h1>Upcoming picks</h1>
  <div class="grid" id="grid"></div>
  <p class="msg" id="msg" hidden></p>
</main>
<script>
const grid=document.getElementById('grid'), msg=document.getElementById('msg');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'TBA';

grid.innerHTML=Array.from({length:9},()=>'<div class="card skel"><div class="poster"></div></div>').join('');

fetch('/api/picks')
  .then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d.results||[]})
  .then(list=>{
    if(!list.length){grid.innerHTML='';msg.hidden=false;msg.textContent='No upcoming picks yet.';return}
    document.getElementById('count').textContent=list.length+(list.length===1?' movie':' movies');
    grid.innerHTML=list.map(m=>`
      <a class="card" href="${esc(m.url)}" target="_blank" rel="noopener">
        <div class="poster">${m.poster?`<img loading="lazy" src="${esc(m.poster)}" alt="${esc(m.title)} poster">`:''}</div>
        <div class="t">${esc(m.title)}</div>
        <div class="d"><span>${fmt(m.release_date)}</span><span class="lg">${esc(m.language||'')}</span></div>
      </a>`).join('');
  })
  .catch(e=>{grid.innerHTML='';msg.hidden=false;msg.textContent=e.message});
</script>
</body>
</html>
